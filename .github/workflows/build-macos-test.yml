name: Build macOS personal test packages

on:
  workflow_dispatch:
  push:
    tags:
      - "macos-test-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            artifact: macos-apple-silicon
          - name: Intel
            runner: macos-15-intel
            artifact: macos-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      VOICE_ASSISTANT_BUNDLE_VERSION: "2.0.1"
      VOICE_ASSISTANT_BUILD_VERSION: "20104"
      VOICE_ASSISTANT_PACKAGE_VERSION: "2.0.1-test.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Run automated tests
        run: python3 -m unittest discover -s tests -v

      - name: Build DMG
        run: bash macos/build_dmg.sh

      - name: Validate bundle metadata and server startup
        shell: bash
        run: |
          set -euo pipefail
          APP="dist/语音输入助手.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "com.fanke.voiceinputassistant"
          PYTHONUNBUFFERED=1 "$APP/Contents/MacOS/VoiceInputAssistant" --server > /tmp/voice-assistant-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..180}; do
            if curl --max-time 1 --fail --silent http://127.0.0.1:56789/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != true ]]; then
            echo "Packaged server did not become ready." >&2
            cat /tmp/voice-assistant-server.log >&2 || true
            exit 1
          fi
          kill "$server_pid"
          wait "$server_pid" || true
          trap - EXIT

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            macos-output/*.dmg
            macos-output/*.sha256.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/macos-test-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-artifacts/*.dmg \
            release-artifacts/*.sha256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "语音输入助手 macOS 个人测试版 2.0.1-test.4" \
            --notes "个人测试版，包含 Apple Silicon 与 Intel 两个 DMG。首次安装步骤见 DMG 内的《安装说明.txt》。本版本使用临时签名，未经 Apple 公证。" \
            --prerelease
